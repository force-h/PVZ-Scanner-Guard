<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Блокировка окон Честный Знак</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title-wrap">
        <span class="indicator" id="statusDot"></span>
        <h2>Ozon Scan Guard</h2>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleGuard" checked>
        <span class="slider"></span>
      </label>
    </div>

    <p class="subtitle">Блокировка окон от Честного Знака</p>

    <div class="stats-box">
      <div class="stats-text">
        <span class="count" id="blockedCount">0</span>
        <span class="label">сбоев предотвращено</span>
      </div>
      <button id="resetBtn" title="Сбросить счетчик">Сброс</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
